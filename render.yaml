# Render Blueprint — FastAPI arka ucu.
#
# Bu dosya depoda durduğu sürece Render "Blueprint" olarak okur:
# GitHub'a push → otomatik derleme → otomatik yayın. Elle tuşa basmaya
# gerek kalmaz.
#
# Kurulum: render.com → New → Blueprint → depoyu seç.
# Ardından aşağıda `sync: false` işaretli değişkenleri panelden doldurun
# (gizli değerler bilerek depoya yazılmıyor).
services:
  - type: web
    name: mehmetkuru-api
    runtime: python
    region: frankfurt
    # Ücretsiz plan: 15 dk hareketsizlikte uykuya geçer, uyanması ~1 dk sürer.
    # Aylık 750 saatlik kota 7/24 çalışan tek servise yetiyor; /health adresine
    # 10 dakikada bir ping atan ücretsiz bir cron servisi uyumasını engelliyor.
    # Trafiği kaldırmadığında `starter`a yükselt — kod değişikliği gerekmiyor.
    plan: free
    rootDir: app/backend
    # Alembic bu depoda yapılandırılmamış (alembic.ini içindeki bağlantı
    # dizesi boş), o yüzden burada çağrılmıyor — çağrılırsa derleme
    # "Could not parse SQLAlchemy URL" ile düşüyor. Tabloları uygulamanın
    # kendisi açılışta oluşturuyor (core/database.py, create_tables).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: IS_LAMBDA
        value: "false"
      # Neon / Render Postgres bağlantı dizesi
      - key: DATABASE_URL
        sync: false
      # Oturum imzalama anahtarı — Render "Generate" ile üretir
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      # Faz 4G — Pages Function'ları ile arka uç arasındaki ortak gizli. Cloudflare
      # Pages'te de AYNI değerle tanımlı olmalı (önce Pages'e, sonra buraya girin).
      # Yokken X-MK-Istemci-IP başlığına imzasız güvenilir (utils/istemci_ip.py).
      - key: VEKIL_ANAHTARI
        sync: false
      # Kimlik sağlayıcı — Google OIDC
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      # Geçiş bitene kadar geçici Pages adresi; 9. fazda mehmetkuru.dev yapılacak.
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_BACKEND_URL
        sync: false
      # AI uçları — OpenAI uyumlu herhangi bir sağlayıcı
      - key: APP_AI_BASE_URL
        sync: false
      - key: APP_AI_KEY
        sync: false
      # S3 uyumlu depolama (Cloudflare R2 önerilir). Faz 2C dosyaları: dördü
      # (+ kova adı) tanımlıysa içerik R2'ye yazılır, indirme 15 dk imzalı
      # adresle; tanımlı değilse Postgres'te (kalıcı ama kota küçük).
      # Render ücretsiz planında KALICI DİSK YOK — yerel diske yazılmıyor.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      # R2 için "auto" (varsayılan); AWS S3 kullanılırsa bölge adı.
      - key: S3_REGION
        sync: false
      # Google OIDC uç adresleri. Uygulama bunları verilmezse kökten
      # türetiyor ({issuer}/authorize gibi); Google bu düzene uymadığı için
      # tek tek veriliyor. Değerler panelde duruyor.
      - key: OIDC_SCOPE
        sync: false
      - key: OIDC_AUTHORIZATION_ENDPOINT
        sync: false
      - key: OIDC_TOKEN_ENDPOINT
        sync: false
      - key: OIDC_JWKS_URI
        sync: false
      - key: OIDC_END_SESSION_ENDPOINT
        sync: false
      # Yönetici hesabı: kimliği ilk girişte oluşan kullanıcının id'si.
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_USER_EMAIL
        sync: false
      # Bildirim e-postaları (Resend). Faz 2F'de gelen e-postanın gövdesini ve
      # eklerini okumak için de kullanılıyor — anahtar "Full access" olmalı.
      - key: RESEND_API_KEY
        sync: false
      # Gönderen adres, ör. "mehmetkuru.dev <destek@mehmetkuru.dev>".
      - key: NOTIFY_FROM_EMAIL
        sync: false
      # Faz 2F — e-postadan destek talebi (DESTEK-EPOSTA-KURULUM.md).
      # Resend webhook'unun imza anahtarı ("whsec_..." ile başlar).
      - key: RESEND_GELEN_IMZA_ANAHTARI
        sync: false
      # İsteğe bağlı: başka bir sağlayıcıdan HMAC imzalı genel uç için gizli anahtar.
      - key: EPOSTA_GELEN_ANAHTARI
        sync: false
      # Faz 3B — Bağlantılar: Google (Analytics 4 + Search Console + YouTube).
      # Ayrıntı GOOGLE-BAGLANTI-KURULUM.md. Giriş (OIDC_*) istemcisinden AYRI bir
      # OAuth istemcisi; yönlendirme adresi …/api/v1/baglantilar/google/geri-donus.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Yenileme jetonunu şifreleyen Fernet anahtarı:
      # `python scripts/baglanti_anahtari_uret.py` (yalnız ekrana basar).
      - key: BAGLANTI_SIFRE_ANAHTARI
        sync: false
